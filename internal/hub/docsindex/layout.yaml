# Die festen Verzeichnisse unter docs/ (docs/indizierung.md, „Struktur unter
# docs/“; Task 033): je Verzeichnis direkt unter docs/ Titel und
# Beschreibung, englisch wie alles in docs/. Der Neubau (rebuild_docs) legt
# sie an — mit einer Mahnung, solange ihnen eine README.md fehlt, die Titel
# und Beschreibung von hier trägt — und lässt sie stehen, auch leer. Alles
# darunter gehört den Nutzern. Eine Änderung hier braucht ein neues Release.
#
#   title        Titel im Index und in der Mahnung
#   description  ein Satz, im Index und in der Mahnung
manual:
  title: Manual
  description: Documentation written by hand.
generated:
  title: Generated
  description: Documentation generated by tools, for example from source code, libraries and external sources.
