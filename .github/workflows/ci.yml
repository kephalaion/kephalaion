name: CI

# Jeder Push auf main und dev, jeder Pull Request und von Hand: Format, vet,
# Tests und der Cross-Build aller vier Plattformen — über dieselben
# Make-Targets wie lokal —, dazu dieselben Prüfungen auf macOS samt
# LaunchAgent und install.sh (derzeit abgeschaltet, siehe Job macos). Der Lauf
# ändert nichts und veröffentlicht nichts.
#
# Zwei Suiten: quick (make check-quick, ohne die langsamen Tests) nur für
# einen Push auf dev — dev ist Zwischenspeicher und soll schnell durch —,
# full (make check) für einen Push auf main und jeden Pull Request. Von Hand
# wählt der Input suite, Vorgabe full. Der Name des Laufs (run-name) nennt die
# Suite, von Hand auch die Kennung: release sucht darüber den vollständigen
# Lauf auf dev für HEAD und stößt ihn bei Bedarf selbst an.

on:
  # Push nur für main und dev: andere Branches kommen als Pull Request. Mit
  # "**" liefen Dependabot-Branches bisher doppelt, einmal für den Push und
  # einmal für den PR. Tags laufen nicht hier, sondern durch release.yml, das
  # selbst prüft; release verlangt einen grünen vollständigen Lauf auf dev.
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "quick (make check-quick) oder full (make check)"
        type: choice
        options:
          - full
          - quick
        default: full
      kennung:
        description: "Frei, erscheint im Namen des Laufs; release setzt sie, um seinen Lauf wiederzufinden"
        type: string
        required: false
        default: ""

# Etwa "CI full, push main", "CI quick, push dev" oder
# "CI full, workflow_dispatch dev, kennung release-…". Der Ausdruck für die
# Suite steht hier und in env gleich: run-name kennt kein env.
run-name: >-
  ${{ format('CI {0}, {1} {2}{3}',
  (github.event_name == 'workflow_dispatch' && inputs.suite) || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'quick') || 'full',
  github.event_name,
  github.head_ref || github.ref_name,
  inputs.kennung && format(', kennung {0}', inputs.kennung) || '') }}

permissions:
  contents: read

env:
  SUITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite) || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'quick') || 'full' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Kein stiller Griff zu einer anderen Toolchain: gebaut wird genau die
      # aus go.mod, sonst scheitert check-toolchain.
      GOTOOLCHAIN: local

    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Die toolchain-Zeile, nicht die go-Direktive: go-version-file nähme die
      # go-Direktive und installierte irgendeine passende Version.
      - name: Toolchain-Version lesen
        id: toolchain
        run: |
          set -eu
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          test -n "$version" || { echo "In go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go einrichten
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          # Noch ohne Abhängigkeiten und damit ohne go.sum.
          cache-dependency-path: go.mod

      - name: Toolchain prüfen
        run: make check-toolchain

      # Node.js für die Erweiterung für VS Code: make dist baut sie mit vsce
      # und bettet sie ins Binary ein. Version und SHA wie in release.yml.
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # full: make check, quick: make check-quick (go test -short).
      - name: Prüfen (${{ env.SUITE }})
        run: |
          set -eu
          case "$SUITE" in
            full) make check ;;
            quick) make check-quick ;;
            *) echo "Unbekannte Suite: $SUITE (erwartet full oder quick)" >&2; exit 1 ;;
          esac

      # Wie im Release: ohne Erweiterung für VS Code scheitert der Lauf, und das
      # gebaute Binary muss sie tragen — im dev build mit 0.0.0.
      - name: make dist
        run: make dist REQUIRE_VSCODE=1

      - name: Erweiterung im Binary prüfen
        run: make vscode-verify VSCODE_BIN=dist/kephalaion-linux-amd64

      # shellcheck ist auf den Ubuntu-Runnern vorinstalliert; lokal läuft
      # in make check nur sh -n.
      - name: shellcheck install.sh
        run: |
          set -eu
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | head -n 2
          shellcheck install.sh

  # macOS nur pro User (LaunchAgent) und hier selten von Hand zu testen: Tests,
  # das Binary dieser Plattform, der LaunchAgent, den es erzeugt, und
  # install.sh gegen das neueste Release. Kein Aufruf der GitHub-API: Die
  # Runner teilen sich Adressen und damit das Rate-Limit ohne Anmeldung.
  #
  # ABGESCHALTET seit 2026-09-26, auf Wunsch des Nutzers: Auf dem macOS-Runner
  # scheiterte TestBackgroundSync fast immer an einer Race-Condition im Test
  # (Läufe 36260080975, 36260519391). Task 013 hat sie behoben; der Job bleibt
  # trotzdem vorerst aus, er wird so schnell nicht gebraucht. Die Definition
  # bleibt, damit Dependabot die gepinnten Actions weiter pflegt; ein
  # übersprungener Job lässt den Lauf grün. Er prüft mit derselben Suite wie
  # der Job check. Wieder einschalten: if: false entfernen.
  #
  # Ohne Node.js-Einrichtung und ohne REQUIRE_VSCODE: make dist-host baut hier
  # gegebenenfalls ein Binary ohne Erweiterung für VS Code (nur eine Warnung).
  # Ob die Erweiterung eingebettet ist, prüfen der Job check und das Release.
  macos:
    if: false
    runs-on: macos-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain-Version lesen
        id: toolchain
        run: |
          set -eu
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          test -n "$version" || { echo "In go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go einrichten
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: go.mod

      - name: Toolchain prüfen
        run: make check-toolchain

      - name: Prüfen (${{ env.SUITE }})
        run: |
          set -eu
          case "$SUITE" in
            full) make check ;;
            quick) make check-quick ;;
            *) echo "Unbekannte Suite: $SUITE (erwartet full oder quick)" >&2; exit 1 ;;
          esac

      - name: make dist-host
        run: make dist-host

      - name: LaunchAgent ausgeben und prüfen
        run: |
          set -eu
          bin="dist/kephalaion-$(go env GOOS)-$(go env GOARCH)"
          "$bin" version
          plist="$RUNNER_TEMP/io.github.kephalaion.plist"
          "$bin" service unit > "$plist"
          cat "$plist"
          plutil -lint "$plist"

      # Den Tag des neuesten Releases liefert die Weiterleitung von
      # releases/latest auf der Webseite, nicht die API.
      - name: install.sh mit dem neuesten Release
        run: |
          set -eu
          url="$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$GITHUB_REPOSITORY/releases/latest")"
          version="${url##*/}"
          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "Kein Tag aus $url gelesen." >&2; exit 1; }
          home="$(mktemp -d)"
          HOME="$home" KEPHALAION_VERSION="$version" sh install.sh
          "$home/.local/bin/kephalaion" version
